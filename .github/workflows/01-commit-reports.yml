name: 提交每日報告
on:
  workflow_run:
    workflows: ["每日股票分析"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: analysis-reports-*
          merge-multiple: true
          path: incoming

      - name: 提交報告
        run: |
          mkdir -p reports
          cp -r incoming/reports/. reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/
          git commit -m "report $(date -u +%F)" || exit 0
          git push
